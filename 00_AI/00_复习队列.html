  return '<article class="card s-'+esc(r.status)+(d?" done":"")+'" id="card-'+esc(r.id)+'" data-sub="'+esc(r.subject)+'" data-st="'+esc(r.status)+'">'+
    '<div class="top"><span class="id">'+esc(r.id)+'</span><span class="area">'+esc(r.area)+'</span>'+
    '<span class="badge '+esc(r.status)+'">'+esc(r.status)+'</span>'+(isOverdue(r)?'<span class="badge 需要重补">逾期</span>':'')+'</div>'+
    '<div class="topic">'+esc(r.topic)+'</div>'+
    '<div class="meta"><span>写入 '+esc(r.written)+'</span><span>上次 '+esc(r.last)+'</span><span>下次 '+esc(r.next)+'</span></div>'+
    '<p class="memo'+(long?" clip":"")+'" id="memo-'+esc(r.id)+'">'+memo+'</p>'+
    (long?'<button class="more" onclick="toggleMemo(\''+esc(r.id)+'\',this)">展开全部</button>':'')+
    '<details class="note"><summary>我的备注'+(note?'（已有）':'')+'</summary>'+
    '<textarea id="note-'+esc(r.id)+'" placeholder="写卡点、复测结果、错法；自动保存在本机">'+note+'</textarea>'+
    '<div class="hint">本机保存，换设备不同步；导出发我给 Hermes 才会进正式记录。</div></details>'+
    '<div class="acts"><label><input type="checkbox" '+(d?"checked":"")+' onchange="toggleDone(\''+esc(r.id)+'\')">本次已复测<span class="doneLab">'+(d?'（'+esc(d)+'）':'')+'</span></label></div>'+
    '</article>';
}

function buildList(){
  var list = document.getElementById("list");
  list.innerHTML = DATA.map(cardHTML).join("");
  DATA.forEach(function(r){
    var ta = document.getElementById("note-"+r.id);
    if(ta) ta.addEventListener("input", function(){
      if(ta.value.trim()) localStorage.setItem(noteKey(r.id), ta.value);
      else localStorage.removeItem(noteKey(r.id));
    });
  });
}

function afterMath(){
  if(window.renderMathInElement){
    try{
      renderMathInElement(document.getElementById("list"),{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false,strict:false});
    }catch(e){}
  }
  window.__guideMathRendered = true;
  try{ window.dispatchEvent(new Event("guide:math-rendered")); }catch(e){}
}

function hay(r){ return (r.id+" "+r.area+" "+r.topic+" "+r.memo+" "+getNote(r.id)).toLowerCase(); }

function cmp(a,b){
  var oa = isOverdue(a)?0:1, ob = isOverdue(b)?0:1;
  if(oa !== ob) return oa-ob;
  if(SORT_STATUS){
    var sa = STATUS_ORDER[a.status], sb = STATUS_ORDER[b.status];
    if(sa !== sb) return sa-sb;
  }
  return a.id.localeCompare(b.id);
}

function visibleRows(){
  var out = [];
  DATA.forEach(function(r){
    var ok = (!SUBJ || r.subject===SUBJ) && (!ST || r.status===ST)
          && (!ONLY_UNDONE || !isDone(r.id))
          && (!Q || hay(r).indexOf(Q.toLowerCase()) >= 0);
    var el = document.getElementById("card-"+r.id);
    if(el) el.style.display = ok ? "" : "none";
    if(ok) out.push(r);
  });
  out.sort(cmp);
  out.forEach(function(r,i){ document.getElementById("card-"+r.id).style.order = i; });
  return out;
}

function renderStats(){
  var c = { "需要重补":0, "仍需锻炼":0, "待评估":0, "优秀":0 }, notes=0, done=0, overdue=0;
  DATA.forEach(function(r){
    if(c[r.status] !== undefined) c[r.status]++;
    if(getNote(r.id)) notes++;
    if(isDone(r.id)) done++;
    if(isOverdue(r)) overdue++;
  });
  document.getElementById("stats").innerHTML =
    "共 <b>"+DATA.length+"</b> 项 · 逾期 <b>"+overdue+"</b> · 需要重补 <b>"+c["需要重补"]+"</b> · 仍需锻炼 <b>"+c["仍需锻炼"]+"</b> · 待评估 <b>"+c["待评估"]+"</b> · 我的备注 <b>"+notes+"</b> · 已复测 <b>"+done+"</b>";
}

function renderChips(){
  var counts = {};
  DATA.forEach(function(r){ counts[r.subject]=(counts[r.subject]||0)+1; });
  document.getElementById("subjectRow").innerHTML = ["","数分","高代","英语"].map(function(s){
    var n = s ? (counts[s]||0) : DATA.length;
    return '<span class="chip'+(SUBJ===s?" sel":"")+'" data-subject="'+s+'">'+(s||"全部")+' <span class="n">'+n+'</span></span>';
  }).join("");
  document.querySelectorAll("[data-subject]").forEach(function(el){
    el.onclick = function(){ SUBJ = el.getAttribute("data-subject"); FIXED=""; render(); };
  });
  document.getElementById("statusRow").innerHTML = ["","需要重补","仍需锻炼","待评估"].map(function(s){
    var n = s ? DATA.filter(function(r){return r.status===s;}).length : DATA.length;
    return '<span class="chip'+(ST===s?" sel":"")+'" data-status="'+s+'">'+(s||"全部状态")+' <span class="n">'+n+'</span></span>';
  }).join("");
  document.querySelectorAll("[data-status]").forEach(function(el){
    el.onclick = function(){ ST = el.getAttribute("data-status"); FIXED=""; render(); };
  });
}

function pickToday(rows){
  var pool = rows.filter(function(r){ return !isDone(r.id); });
  if(FIXED){ for(var i=0;i<pool.length;i++) if(pool[i].id===FIXED) return pool[i]; }
  return pool[0] || null;
}

function renderToday(rows){
  var r = pickToday(rows);
  var box = document.getElementById("today");
  if(!r){ box.innerHTML = '<div class="lab">今日主复测</div><p>当前筛选下没有未复测条目。</p>'; return; }
  box.innerHTML =
    '<div class="lab">今日主复测（逾期 &gt; 需要重补 &gt; 仍需锻炼 &gt; 待评估）</div>'+
    '<h2>'+esc(r.id)+' · '+esc(r.topic)+'</h2>'+
    '<p>'+esc(r.area)+' ｜ 状态：'+esc(r.status)+' ｜ 上次：'+esc(r.last)+' ｜ 下次：'+esc(r.next)+'</p>'+
    '<p>出口写在备注末段。复测完在卡片勾「本次已复测」，把结果写进「我的备注」，再点「导出我的备注」发我。</p>'+
    '<div class="row"><button onclick="jump(\''+r.id+'\')">跳到卡片</button><button onclick="shuffleDay()">换一条</button></div>';
}

function shuffleDay(){
  var rows = visibleRows().filter(function(r){ return !isDone(r.id); });
  if(rows.length < 2) return;
  var cur = pickToday(rows), idx = 0;
  for(var i=0;i<rows.length;i++) if(cur && rows[i].id===cur.id) idx=i;
  FIXED = rows[(idx+1)%rows.length].id;
  renderToday(visibleRows());
}

function jump(id){
  var el = document.getElementById("card-"+id);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.outline="2px solid var(--acc)"; setTimeout(function(){el.style.outline="";},1500); }
}

function toggleMemo(id, btn){
  var p = document.getElementById("memo-"+id);
  p.classList.toggle("clip");
  btn.textContent = p.classList.contains("clip") ? "展开全部" : "收起";
}

function toggleDone(id){
  var k = doneKey(id);
  if(localStorage.getItem(k)) localStorage.removeItem(k);
  else localStorage.setItem(k, TODAY);
  var v = localStorage.getItem(k);
  var el = document.getElementById("card-"+id);
  if(el){
    el.classList.toggle("done", !!v);
    var cb = el.querySelector('input[type=checkbox]'); if(cb) cb.checked = !!v;
    var lab = el.querySelector('.doneLab'); if(lab) lab.textContent = v ? '（'+v+'）' : '';
  }
  render();
}

function exportNotes(){
  var lines = ["# 复习队列 · 我的备注（"+TODAY+" 导出）",""];
  var n0 = 0;
  DATA.forEach(function(r){
    var n = getNote(r.id).trim(), d = isDone(r.id);
    if(!n && !d) return;
    n0++;
    lines.push("## "+r.id+" · "+r.area+" · "+r.topic);
    lines.push("- 状态："+r.status+"；本次已复测："+(d?d:"否"));
    if(n) lines.push("- 我的备注："+n.replace(/\n/g,"\n  "));
    lines.push("");
  });
  var text = n0 ? lines.join("\n") : "（本机还没有任何备注）";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("已复制 "+n0+" 条，粘贴给 Hermes"); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制，粘贴给 Hermes"); }catch(e){ alert(text); }
  document.body.removeChild(ta);
}

function render(){
  renderStats(); renderChips();
  renderToday(visibleRows());
}

document.getElementById("q").addEventListener("input", function(e){ Q = e.target.value; render(); });
document.getElementById("sortBtn").onclick = function(){
  SORT_STATUS = !SORT_STATUS;
  this.textContent = "排序：" + (SORT_STATUS ? "状态优先" : "编号优先");
  this.classList.toggle("on", !SORT_STATUS);
  render();
};
document.getElementById("onlyUndone").onclick = function(){
  ONLY_UNDONE = !ONLY_UNDONE; this.classList.toggle("on", ONLY_UNDONE); render();
};
document.getElementById("exportBtn").onclick = exportNotes;

buildList();
afterMath();
render();
</script>
</body>
</html>
