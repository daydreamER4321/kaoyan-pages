<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('zt-data').textContent);
  var state = {subject:'610', mode:'paper', year:null, chapters:new Set(), years:new Set(), q:''};
  var ANS = null; // currently open answer card id
  var IS_WEB = /(^|\.)github\.io$/.test(location.hostname);
  function zurl(r, kind){
    if(!r || !r[kind]) return null;
    var p = IS_WEB ? ("_zhenti/"+r.subject+"-"+r.year+"-"+kind+".pdf") : r[kind];
    return encodeURI(p);
  }

  function yearsOf(subject){
    var ys = Array.from(new Set(DATA.filter(function(r){return r.subject===subject;}).map(function(r){return r.year;})));
    ys.sort();
    return ys;
  }
  function chaptersOf(subject){
    var m = {};
    DATA.forEach(function(r){ if(r.subject===subject) r.chapters.forEach(function(c){ m[c]=(m[c]||0)+1; }); });
    return Object.keys(m).sort(function(a,b){ return m[b]-m[a] || a.localeCompare(b,'zh'); });
  }
  function rowsOf(){
    var rs = DATA.filter(function(r){return r.subject===state.subject;});
    if(state.mode==='paper'){
      if(state.year) rs = rs.filter(function(r){return r.year===state.year;});
    } else {
      if(state.chapters.size) rs = rs.filter(function(r){ return r.chapters.some(function(c){return state.chapters.has(c);}); });
      if(state.years.size) rs = rs.filter(function(r){return state.years.has(r.year);});
      if(state.q.trim()){ var q=state.q.trim().toLowerCase(); rs = rs.filter(function(r){ return (r.desc+' '+r.chapters.join(' ')+' '+r.type+' '+r.year).toLowerCase().indexOf(q)>=0; }); }
    }
    return rs;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function encodePath(p){ return encodeURI(p); }

  function renderTop(){
    var srow = document.getElementById('subjRow'); srow.innerHTML='';
    [['610','610 数学分析'],['801','801 高等代数']].forEach(function(p){
      var b=document.createElement('button'); b.textContent=p[1]; b.className = state.subject===p[0]?'on':'';
      b.onclick=function(){ state.subject=p[0]; state.year=null; state.chapters.clear(); state.years.clear(); renderAll(); };
      srow.appendChild(b);
    });
    var mrow = document.getElementById('modeRow'); mrow.innerHTML='';
    [['paper','套题模式（按年份）'],['point','考点模式（筛选）']].forEach(function(p){
      var b=document.createElement('button'); b.textContent=p[1]; b.className = state.mode===p[0]?'on':'';
      b.onclick=function(){ state.mode=p[0]; renderAll(); };
      mrow.appendChild(b);
    });
  }

  function renderFilters(){
    var box=document.getElementById('filters'); box.innerHTML='';
    var ys = yearsOf(state.subject), chs = chaptersOf(state.subject);
    if(state.mode==='paper'){
      if(!state.year) state.year = ys[ys.length-1];
      var row=document.createElement('div'); row.className='row';
      var lab=document.createElement('span'); lab.className='meta'; lab.textContent='年份：'; row.appendChild(lab);
      ys.forEach(function(y){
        var b=document.createElement('button'); b.textContent=y; b.className = state.year===y?'on':'';
        b.onclick=function(){ state.year=y; renderAll(); }; row.appendChild(b);
      });
      box.appendChild(row);
    } else {
      var r1=document.createElement('div'); r1.className='row';
      var l1=document.createElement('span'); l1.className='meta'; l1.textContent='考点（可多选）：'; r1.appendChild(l1);
      chs.forEach(function(c){
        var b=document.createElement('span'); b.className='chip small'+(state.chapters.has(c)?' sel':''); b.textContent=c;
        b.onclick=function(){ if(state.chapters.has(c)) state.chapters.delete(c); else state.chapters.add(c); renderAll(); };
        r1.appendChild(b);
      });
      var clr=document.createElement('button'); clr.textContent='清空考点'; clr.onclick=function(){state.chapters.clear(); renderAll();}; r1.appendChild(clr);
      box.appendChild(r1);
      var r2=document.createElement('div'); r2.className='row'; r2.style.marginTop='8px';
      var l2=document.createElement('span'); l2.className='meta'; l2.textContent='年份（可多选）：'; r2.appendChild(l2);
      ys.forEach(function(y){
        var b=document.createElement('span'); b.className='chip small'+(state.years.has(y)?' sel':''); b.textContent=y;
        b.onclick=function(){ if(state.years.has(y)) state.years.delete(y); else state.years.add(y); renderAll(); };
        r2.appendChild(b);
      });
      var inp=document.createElement('input'); inp.type='search'; inp.placeholder='搜关键词（考点/类型/年份）'; inp.value=state.q; inp.style.minWidth='220px';
      inp.oninput=function(){ state.q=inp.value; renderListOnly(); };
      r2.appendChild(inp);
      box.appendChild(r2);
    }
  }

  function renderFreq(){
    var box=document.getElementById('freq'); box.innerHTML='';
    if(state.mode!=='point') return;
    var ys=yearsOf(state.subject);
    var m={}, totals={};
    ys.forEach(function(y){ totals[y]=0; });
    DATA.forEach(function(r){
      if(r.subject!==state.subject) return;
      totals[r.year]=(totals[r.year]||0)+1;
      r.chapters.forEach(function(c){
        if(!m[c]) m[c]={by:{},total:0};
        m[c].by[r.year]=(m[c].by[r.year]||0)+1; m[c].total++;
      });
    });
    var chs=Object.keys(m).sort(function(a,b){ return m[b].total-m[a].total || a.localeCompare(b,'zh'); });
    var max=0;
    chs.forEach(function(c){ ys.forEach(function(y){ var v=m[c].by[y]||0; if(v>max) max=v; }); });
    if(!max) max=1;

    var d=document.createElement('details'); d.className='freqwrap'; d.open=true;
    var sm=document.createElement('summary');
    sm.textContent='考频表：考点 × 年份命中题数';
    var hint=document.createElement('span'); hint.className='hint';
    hint.textContent='（点考点名＝筛选该考点；一题多考点会重复计数）';
    sm.appendChild(hint); d.appendChild(sm);

    var scroll=document.createElement('div'); scroll.className='freqscroll';
    var tb=document.createElement('table'); tb.className='freq';

    var thead=document.createElement('thead'); var htr=document.createElement('tr');
    var th0=document.createElement('th'); th0.className='c'; th0.textContent='考点'; htr.appendChild(th0);
    ys.forEach(function(y){
      var th=document.createElement('th'); th.textContent=y;
      if(state.years.size && !state.years.has(y)) th.className='off';
      htr.appendChild(th);
    });
    var thT=document.createElement('th'); thT.textContent='合计'; htr.appendChild(thT);
    thead.appendChild(htr); tb.appendChild(thead);

    var tbody=document.createElement('tbody');
    chs.forEach(function(c){
      var tr=document.createElement('tr');
      if(state.chapters.has(c)) tr.className='sel';
      var th=document.createElement('th'); th.className='c';
      var btn=document.createElement('button'); btn.className='freqch'; btn.textContent=c;
      btn.onclick=function(){ if(state.chapters.has(c)) state.chapters.delete(c); else state.chapters.add(c); renderAll(); };
      th.appendChild(btn); tr.appendChild(th);
      ys.forEach(function(y){
        var v=m[c].by[y]||0;
        var td=document.createElement('td'); td.className='v'+(v?'':' z'); td.textContent=v;
        if(v) td.style.background='color-mix(in srgb, var(--acc) '+Math.round(6+62*(v/max))+'%, transparent)';
        tr.appendChild(td);
      });
      var tt=document.createElement('td'); tt.className='tot'; tt.textContent=m[c].total; tr.appendChild(tt);
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);

    var tfoot=document.createElement('tfoot');
    function footRow(label, perYear, cls){
      var tr=document.createElement('tr'); if(cls) tr.className=cls;
      var th=document.createElement('th'); th.className='c'; th.textContent=label; tr.appendChild(th);
      var sum=0;
      ys.forEach(function(y){
        var v=perYear[y]||0; sum+=v;
        var td=document.createElement('td'); td.className='v'; td.textContent=v; tr.appendChild(td);
      });
      var tt=document.createElement('td'); tt.className='tot'; tt.textContent=sum; tr.appendChild(tt);
      return tr;
    }
    tfoot.appendChild(footRow('当年全部题', totals));

    var cur={}; var rs=rowsOf();
    rs.forEach(function(r){ cur[r.year]=(cur[r.year]||0)+1; });
    var curLabel = (state.chapters.size||state.years.size||state.q.trim()) ? '当前筛选' : '当前筛选（未筛）';
    tfoot.appendChild(footRow(curLabel, cur, 'cur'));
    tb.appendChild(tfoot);

    scroll.appendChild(tb); d.appendChild(scroll);
    box.appendChild(d);
  }

  function paperCard(year){
    var rows = DATA.filter(function(r){return r.subject===state.subject && r.year===year;});
    if(!rows.length) return null;
    var p = rows[0];
    var div=document.createElement('div'); div.className='paper';
    var h=document.createElement('h2'); h.textContent = state.subject+' · '+year+' 年'; div.appendChild(h);
    var meta=document.createElement('div'); meta.className='meta';
    meta.textContent = '题目条目 '+rows.length+' 条；'+ (p.paperNote||'');
    div.appendChild(meta);
    var acts=document.createElement('div'); acts.className='acts'; acts.style.marginTop='8px';
    if(p.test){ var a=document.createElement('a'); a.href=zurl(p,'test'); a.target='_blank'; a.textContent='打开原卷 PDF'; acts.appendChild(a); }
    if(p.ans){ var b=document.createElement('a'); b.href=zurl(p,'ans'); b.target='_blank'; b.textContent='打开整卷解析 PDF'; acts.appendChild(b); }
    else { var sp=document.createElement('span'); sp.className='meta'; sp.textContent='该年无电子解析'; acts.appendChild(sp); }
    div.appendChild(acts);
    return div;
  }

  function qCard(r){
    var div=document.createElement('div'); div.className='card';
    var head=document.createElement('div'); head.className='qhead';
    var no=document.createElement('span'); no.className='qno';
    no.textContent = (state.mode==='paper'? '' : r.year+' · ') + '第 '+r.no+' 题'; head.appendChild(no);
    var spacer=document.createElement('span'); spacer.style.flex='1'; head.appendChild(spacer);
    var lab=document.createElement('label'); lab.className='done'; var cb=document.createElement('input'); cb.type='checkbox';
    cb.checked = localStorage.getItem('zt-done:'+r.id)==='1';
    cb.onchange=function(){ if(cb.checked) localStorage.setItem('zt-done:'+r.id,'1'); else localStorage.removeItem('zt-done:'+r.id); };
    lab.appendChild(cb); var lt=document.createElement('span'); lt.textContent='做过'; lab.appendChild(lt); head.appendChild(lab);
    div.appendChild(head);

    var mrow=document.createElement('div'); mrow.className='qmeta';
    r.chapters.forEach(function(c){ var s=document.createElement('span'); s.className='chip'; s.textContent=c; mrow.appendChild(s); });
    var t=document.createElement('span'); t.className='ty'; t.textContent=r.type+' · '+r.diff; mrow.appendChild(t);
    div.appendChild(mrow);

    var desc=document.createElement('div'); desc.className='desc';
    var l=document.createElement('span'); l.className='lab'; l.textContent='提要'; desc.appendChild(l);
    var sp=document.createElement('span'); sp.textContent=r.desc; desc.appendChild(sp);
    div.appendChild(desc);

    var acts=document.createElement('div'); acts.className='acts';
    if(r.test){ var a=document.createElement('a'); a.href=zurl(r,'test'); a.target='_blank'; a.textContent='原卷 PDF'; acts.appendChild(a); }
    var btn=document.createElement('button'); btn.textContent='显示答案 ▾'; acts.appendChild(btn);
    div.appendChild(acts);

    var ans=document.createElement('div'); ans.className='ans';
    if(r.ans){
      var tip=document.createElement('div'); tip.className='tip'; tip.textContent='整卷参考解析（未做逐题页码定位）；可另开标签页细看：'; ans.appendChild(tip);
      var link=document.createElement('a'); link.href=zurl(r,'ans'); link.target='_blank'; link.textContent='在新标签打开解析 PDF'; ans.appendChild(link);
      var box=document.createElement('div'); box.style.marginTop='8px'; ans.appendChild(box);
      btn.onclick=function(){
        if(window.innerWidth<760){ window.open(zurl(r,'ans'),'_blank'); return; }
        var open = !ans.classList.contains('open');
        document.querySelectorAll('.ans.open').forEach(function(el){ el.classList.remove('open'); var f=el.querySelector('iframe'); if(f) f.remove(); });
        if(open){
          ans.classList.add('open');
          if(!box.querySelector('iframe')){ var f=document.createElement('iframe'); f.src=zurl(r,'ans'); f.loading='lazy'; box.appendChild(f); }
        }
        btn.textContent = ans.classList.contains('open') ? '收起答案 ▴' : '显示答案 ▾';
      };
    } else {
      var tip2=document.createElement('div'); tip2.className='tip'; tip2.textContent='该年没有电子解析（原卷可在上方打开）。'; ans.appendChild(tip2);
      btn.onclick=function(){ var open=!ans.classList.contains('open'); ans.classList.toggle('open'); btn.textContent = ans.classList.contains('open') ? '收起答案 ▴' : '显示答案 ▾'; };
    }
    div.appendChild(ans);
    return div;
  }

  function renderListOnly(){
    var list=document.getElementById('list'); list.innerHTML='';
    var rs=rowsOf();
    var cb=document.getElementById('countBar');
    cb.innerHTML = '共 <b>'+rs.length+'</b> 条' + (state.mode==='point' && (state.chapters.size||state.years.size||state.q) ? '（已筛选）' : '');
    if(!rs.length){ var e=document.createElement('div'); e.className='empty'; e.textContent='没有符合条件的题目'; list.appendChild(e); return; }
    if(state.mode==='paper'){
      var pc = paperCard(state.year); if(pc) list.appendChild(pc);
      rs.sort(function(a,b){ return a.no.localeCompare(b.no,'zh',{numeric:true}); });
      rs.forEach(function(r){ list.appendChild(qCard(r)); });
    } else {
      rs = rs.slice().sort(function(a,b){ return (a.year-b.year) || a.no.localeCompare(b.no,'zh',{numeric:true}); });
      rs.forEach(function(r){ list.appendChild(qCard(r)); });
    }
    if(window.renderMathInElement){ try{ renderMathInElement(list,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false,strict:false}); }catch(e){} }
  }

  function renderAll(){ renderTop(); renderFilters(); renderFreq(); renderListOnly(); }
  renderAll();
})();
</script>
</body>
</html>
