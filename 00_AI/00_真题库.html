  function partKey(c){
    var s = String(c), a = s.charAt(0), b = s.charAt(1);
    if(/[0-9]/.test(a) && /[0-9]/.test(b)) return a+b;
    return '?';
  }
  function partOf(subject, c){
    var k = partKey(c), ps = PARTS[subject];
    for(var i=0;i<ps.length;i++){ if(ps[i].chs.indexOf(k)>=0) return ps[i].k; }
    return '?';
  }
  function partsOf(subject){
    var ps = PARTS[subject].slice();
    var hasUnknown = DATA.some(function(r){ return r.subject===subject && r.chapters.some(function(c){ return partOf(subject,c)==='?'; }); });
    if(hasUnknown) ps.push({k:'?', n:'未分类', name:'题面缺 / 未知', chs:[]});
    return ps;
  }
  function partTotal(subject, key){
    return DATA.filter(function(r){ return r.subject===subject && r.chapters.some(function(c){ return partOf(subject,c)===key; }); }).length;
  }
  function rowsOf(){
    var rs = DATA.filter(function(r){return r.subject===state.subject;});
    if(state.mode==='paper'){
      if(state.year) rs = rs.filter(function(r){return r.year===state.year;});
    } else {
      if(state.parts.size) rs = rs.filter(function(r){ return r.chapters.some(function(c){return state.parts.has(partOf(state.subject,c));}); });
      if(state.years.size) rs = rs.filter(function(r){return state.years.has(r.year);});
      if(state.q.trim()){ var q=state.q.trim().toLowerCase(); rs = rs.filter(function(r){ return (r.stem+' '+(r.desc||'')+' '+r.chapters.join(' ')+' '+r.type+' '+r.year).toLowerCase().indexOf(q)>=0; }); }
    }
    return rs.filter(recordMatches);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function encodePath(p){ return encodeURI(p); }

  function statusLabel(k){
    var x=STATUS.find(function(v){return v.k===k;}); return x ? x.n : '未登记';
  }
  function resultLabel(k){
    var x=RESULTS.find(function(v){return v.k===k;}); return x ? x.n : '未判';
  }
  function errorLabel(k){
    var x=ERRORS.find(function(v){return v.k===k;}); return x ? x.n : k;
  }
  function queueLinksHTML(r){
    if(!r.queueIds || !r.queueIds.length) return '';
    return '<div class="queue-links">关联复习项：'+r.queueIds.map(function(id){
      return '<a href="00_复习队列.html#card-'+encodeURIComponent(id)+'">'+esc(id)+'</a>';
    }).join(' ')+'</div>';
  }
  function emptyRecord(){ return {status:'unrecorded',result:'unknown',errors:[],note:'',updated:''}; }
  function readRecord(id){
    var d=emptyRecord();
    try{
      var raw=localStorage.getItem('zt-record:'+id);
      if(raw){
        var x=JSON.parse(raw)||{};
        d.status=STATUS.some(function(v){return v.k===x.status;})?x.status:'unrecorded';
        d.result=RESULTS.some(function(v){return v.k===x.result;})?x.result:'unknown';
        d.errors=Array.isArray(x.errors)?x.errors.filter(function(k){return ERRORS.some(function(v){return v.k===k;});}):[];
        d.note=typeof x.note==='string'?x.note:'';
        d.updated=typeof x.updated==='string'?x.updated:'';
        return d;
      }
      if(localStorage.getItem('zt-done:'+id)==='1') d.status='legacy';
    }catch(e){}
    return d;
  }
  function saveRecord(id, rec){
    try{
      localStorage.setItem('zt-record:'+id, JSON.stringify(rec));
      localStorage.removeItem('zt-done:'+id);
      return true;
    }catch(e){ return false; }
  }
  function clearRecord(id){
    try{
      localStorage.removeItem('zt-record:'+id);
      localStorage.removeItem('zt-done:'+id);
      return true;
    }catch(e){ return false; }
  }
  function recordMatches(r){
    var rec=readRecord(r.id);
    return state.recordFilter==='all' || (state.recordFilter==='errors' ? rec.errors.length>0 : rec.status===state.recordFilter);
  }
  function recordStats(subject){
    var out={total:0,errors:0};
    STATUS.forEach(function(s){out[s.k]=0;});
    DATA.forEach(function(r){
      if(r.subject!==subject) return;
      var rec=readRecord(r.id); out.total++; out[rec.status]=(out[rec.status]||0)+1;
      if(rec.errors.length) out.errors++;
    });
    return out;
  }
  function downloadText(filename, text){
    var blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},0);
  }
  function exportRecords(){
    var rs=rowsOf().filter(function(r){return readRecord(r.id).status!=='unrecorded';});
    var lines=['# 真题库作答记录导出','','> 页面记录只保存在当前浏览器；以下内容待 Hermes 核验后再进入正式状态。',''];
    rs.forEach(function(r){
      var rec=readRecord(r.id);
      lines.push('## '+r.subject+' · '+r.year+' · 第'+r.no+'题');
      lines.push('- 状态：'+statusLabel(rec.status));
      lines.push('- 结果：'+resultLabel(rec.result));
      lines.push('- 错因：'+(rec.errors.length?rec.errors.map(errorLabel).join('；'):'无/未标注'));
      lines.push('- 备注：'+(rec.note||'无'));
      lines.push('- 页面题目 ID：`'+r.id+'`','');
    });
    downloadText('真题作答记录_'+state.subject+'.md',lines.join('\n'));
  }

  function renderFreq(){
    var box=document.getElementById('freq'); box.innerHTML='';
    if(state.mode!=='point') return;
    var ys=yearsOf(state.subject), ps=partsOf(state.subject);
    var m={}, totals={};
    ys.forEach(function(y){ totals[y]=0; });
    ps.forEach(function(p){ m[p.k]={by:{},total:0}; });
    DATA.forEach(function(r){
      if(r.subject!==state.subject) return;
      totals[r.year]=(totals[r.year]||0)+1;
      var seen={};
      r.chapters.forEach(function(c){
        var k=partOf(state.subject,c);
        if(seen[k]) return; seen[k]=1;
        if(!m[k]) m[k]={by:{},total:0};
        m[k].by[r.year]=(m[k].by[r.year]||0)+1; m[k].total++;
      });
    });
    var rows=ps.filter(function(p){ return m[p.k] && m[p.k].total>0; });
    var max=1;
    rows.forEach(function(p){ ys.forEach(function(y){ var v=m[p.k].by[y]||0; if(v>max) max=v; }); });

    var d=document.createElement('details'); d.className='freqwrap'; d.open=true;
    var sm=document.createElement('summary');
    sm.textContent='考频表：考纲条目 × 年份命中题数';
    var hint=document.createElement('span'); hint.className='hint';
    hint.textContent='（点条目名＝筛选该条目；一题跨两个条目时两边都计数）';
    sm.appendChild(hint); d.appendChild(sm);

    var scroll=document.createElement('div'); scroll.className='freqscroll';
    var tb=document.createElement('table'); tb.className='freq';

    var thead=document.createElement('thead'); var htr=document.createElement('tr');
    var th0=document.createElement('th'); th0.className='c'; th0.textContent='考纲条目'; htr.appendChild(th0);
    ys.forEach(function(y){
      var th=document.createElement('th'); th.textContent=y;
      if(state.years.size && !state.years.has(y)) th.className='off';
      htr.appendChild(th);
    });
    var thT=document.createElement('th'); thT.textContent='合计'; htr.appendChild(thT);
    thead.appendChild(htr); tb.appendChild(thead);

    var tbody=document.createElement('tbody');
    rows.forEach(function(p){
      var tr=document.createElement('tr');
      if(state.parts.has(p.k)) tr.className='sel';
      var th=document.createElement('th'); th.className='c';
      var btn=document.createElement('button'); btn.className='freqch'; btn.textContent=p.n+' '+p.name;
      btn.onclick=function(){ if(state.parts.has(p.k)) state.parts.delete(p.k); else state.parts.add(p.k); renderAll(); };
      th.appendChild(btn); tr.appendChild(th);
      ys.forEach(function(y){
        var v=m[p.k].by[y]||0;
        var td=document.createElement('td'); td.className='v'+(v?'':' z'); td.textContent=v;
        if(v) td.style.background='color-mix(in srgb, var(--acc) '+Math.round(6+62*(v/max))+'%, transparent)';
        tr.appendChild(td);
      });
      var tt=document.createElement('td'); tt.className='tot'; tt.textContent=m[p.k].total; tr.appendChild(tt);
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);

    var tfoot=document.createElement('tfoot');
    function footRow(label, perYear, cls){
      var tr=document.createElement('tr'); if(cls) tr.className=cls;
      var th=document.createElement('th'); th.className='c'; th.textContent=label; tr.appendChild(th);
      var sum=0;
      ys.forEach(function(y){
        var v=perYear[y]||0; sum+=v;
        var td=document.createElement('td'); td.className='v'; td.textContent=v; tr.appendChild(td);
      });
      var tt=document.createElement('td'); tt.className='tot'; tt.textContent=sum; tr.appendChild(tt);
      return tr;
    }
    tfoot.appendChild(footRow('当年全部题', totals));

    if(state.parts.size||state.years.size||state.q.trim()){
      var cur={}; var rs=rowsOf();
      rs.forEach(function(r){ cur[r.year]=(cur[r.year]||0)+1; });
      tfoot.appendChild(footRow('当前筛选', cur, 'cur'));
    }
    tb.appendChild(tfoot);

    scroll.appendChild(tb); d.appendChild(scroll);
    box.appendChild(d);
  }

  function qCard(r){
    var rec=readRecord(r.id);
    var div=document.createElement('div'); div.className='card qcard'; div.setAttribute('data-question-id',r.id);
    div.setAttribute('id','question-'+r.id);
    var head=document.createElement('div'); head.className='qhead';
    var no=document.createElement('span'); no.className='qno';
    no.textContent = (state.mode==='paper'? '' : r.year+' · ') + '第 '+r.no+' 题'; head.appendChild(no);
    if(r.points){ var pt=document.createElement('span'); pt.className='qpts'; pt.textContent='（'+r.points+' 分）'; head.appendChild(pt); }
    var spacer=document.createElement('span'); spacer.style.flex='1'; head.appendChild(spacer);
    var badge=document.createElement('span'); badge.className='record-badge status-'+rec.status; badge.textContent=statusLabel(rec.status); head.appendChild(badge);
    if(rec.errors.length){
      var es=document.createElement('span'); es.className='error-summary';
      rec.errors.forEach(function(k){ var e=document.createElement('span'); e.className='error-chip'; e.textContent=errorLabel(k); es.appendChild(e); });
      head.appendChild(es);
    }
    div.appendChild(head);

    var mrow=document.createElement('div'); mrow.className='qmeta';
    r.chapters.forEach(function(c){ var s=document.createElement('span'); s.className='chip'; s.textContent=c; mrow.appendChild(s); });
    var t=document.createElement('span'); t.className='ty'; t.textContent=r.type+' · '+r.diff; mrow.appendChild(t);
    div.appendChild(mrow);
    var qlinks=queueLinksHTML(r); if(qlinks){ var qwrap=document.createElement('div'); qwrap.innerHTML=qlinks; div.appendChild(qwrap.firstChild); }

    if(r.stem){
      var st=document.createElement('div'); st.className='stem';
      st.innerHTML = r.stem.split('\\n').map(function(line){ return line.trim()? '<p>'+line+'</p>' : ''; }).join('');
      div.appendChild(st);
    }
    if(r.note || r.missing){
      var nt=document.createElement('div'); nt.className='qnote';
      if(r.note){ nt.innerHTML += '<b>原注</b>：'+r.note; }
      if(r.missing){ nt.innerHTML += (r.note?'<br>':'')+'<b>缺项</b>：'+r.missing; }
      div.appendChild(nt);
    }

    var record=document.createElement('details'); record.className='record-fold';
    var rsum=document.createElement('summary');
    rsum.textContent='我的记录：'+statusLabel(rec.status)+(rec.result!=='unknown'?' · '+resultLabel(rec.result):'')+(rec.errors.length?' · '+rec.errors.length+' 类错因':'');
    record.appendChild(rsum);
    var rb=document.createElement('div'); rb.className='record-body';
    var row1=document.createElement('div'); row1.className='record-row';
    var sl=document.createElement('label'); sl.textContent='状态：'; row1.appendChild(sl);
    var ss=document.createElement('select');
    STATUS.forEach(function(x){ var o=document.createElement('option'); o.value=x.k; o.textContent=x.n; ss.appendChild(o); });
    ss.value=rec.status; row1.appendChild(ss);
    var rl=document.createElement('label'); rl.textContent='结果：'; row1.appendChild(rl);
    var rs=document.createElement('select');
    RESULTS.forEach(function(x){ var o=document.createElement('option'); o.value=x.k; o.textContent=x.n; rs.appendChild(o); });
    rs.value=rec.result; row1.appendChild(rs); rb.appendChild(row1);

    var row2=document.createElement('div'); row2.className='record-row';
    var el=document.createElement('label'); el.textContent='错因（可多选）：'; row2.appendChild(el);
    var errorInputs=[];
    ERRORS.forEach(function(x){
      var lab=document.createElement('label'); lab.className='error-pick';
      var cb=document.createElement('input'); cb.type='checkbox'; cb.value=x.k; cb.checked=rec.errors.indexOf(x.k)>=0;
      errorInputs.push(cb); lab.appendChild(cb); lab.appendChild(document.createTextNode(x.n)); row2.appendChild(lab);
    });
    rb.appendChild(row2);

    var nl=document.createElement('label'); nl.textContent='具体怎么错：'; rb.appendChild(nl);
    var ta=document.createElement('textarea'); ta.placeholder='写清楚卡在工具判断、推导、计算还是书写哪一步。'; ta.value=rec.note; rb.appendChild(ta);
    var act=document.createElement('div'); act.className='acts';
    var save=document.createElement('button'); save.className='record-save'; save.textContent='保存记录'; act.appendChild(save);
    var clear=document.createElement('button'); clear.className='record-save'; clear.textContent='清除本题记录'; act.appendChild(clear);
    var hint=document.createElement('span'); hint.className='record-hint'; hint.textContent=rec.updated?'最近保存：'+rec.updated:'尚未保存本题记录'; act.appendChild(hint);
    rb.appendChild(act); record.appendChild(rb); div.appendChild(record);
    save.onclick=function(){
      var errors=errorInputs.filter(function(c){return c.checked;}).map(function(c){return c.value;});
      var next={status:ss.value,result:rs.value,errors:errors,note:ta.value.trim(),updated:new Date().toISOString()};
      if(saveRecord(r.id,next)) renderListOnly(); else hint.textContent='保存失败：当前浏览器不允许 localStorage';
    };
    clear.onclick=function(){ if(clearRecord(r.id)) renderListOnly(); else hint.textContent='清除失败：当前浏览器不允许 localStorage'; };

    var acts=document.createElement('div'); acts.className='acts';
    if(r.test){ var a=document.createElement('a'); a.href=zurl(r,'test'); a.target='_blank'; a.textContent='原卷 PDF'; acts.appendChild(a); }
    var btn=document.createElement('button'); btn.textContent='显示答案 ▾'; acts.appendChild(btn);
    div.appendChild(acts);

    var ans=document.createElement('div'); ans.className='ans';
    if(r.ans){
      var tip=document.createElement('div'); tip.className='tip'; tip.textContent='整卷参考解析（未做逐题页码定位）；可另开标签页细看：'; ans.appendChild(tip);
      var link=document.createElement('a'); link.href=zurl(r,'ans'); link.target='_blank'; link.textContent='在新标签打开解析 PDF'; ans.appendChild(link);
      var box=document.createElement('div'); box.style.marginTop='8px'; ans.appendChild(box);
      btn.onclick=function(){
        if(window.innerWidth<760){ window.open(zurl(r,'ans'),'_blank'); return; }
        var open = !ans.classList.contains('open');
        document.querySelectorAll('.ans.open').forEach(function(el){ el.classList.remove('open'); var f=el.querySelector('iframe'); if(f) f.remove(); });
        if(open){
          ans.classList.add('open');
          if(!box.querySelector('iframe')){ var f=document.createElement('iframe'); f.src=zurl(r,'ans'); f.loading='lazy'; box.appendChild(f); }
        }
        btn.textContent = ans.classList.contains('open') ? '收起答案 ▴' : '显示答案 ▾';
      };
    } else {
      var tip2=document.createElement('div'); tip2.className='tip'; tip2.textContent='该年没有电子解析（原卷可在上方打开）。'; ans.appendChild(tip2);
      btn.onclick=function(){ var open=!ans.classList.contains('open'); ans.classList.toggle('open'); btn.textContent = ans.classList.contains('open') ? '收起答案 ▴' : '显示答案 ▾'; };
    }
    div.appendChild(ans);
    return div;
  }

  function renderListOnly(){
    var list=document.getElementById('list'); list.innerHTML='';
    var rs=rowsOf();
    var cb=document.getElementById('countBar');
    var stats=recordStats(state.subject);
    cb.innerHTML = '当前 <b>'+rs.length+'</b> 条' + (state.mode==='point' && (state.parts.size||state.years.size||state.q) ? '（已筛选）' : '') +
      ' · 未登记 '+stats.unrecorded+' · 未做 '+stats.unattempted+' · 已尝试 '+stats.attempted+' · 独立做出 '+stats.independent+' · 有错因 '+stats.errors;
    if(!rs.length){ var e=document.createElement('div'); e.className='empty'; e.textContent='没有符合条件的题目'; list.appendChild(e); return; }
    if(state.mode==='paper'){
      var pc = paperCard(state.year); if(pc) list.appendChild(pc);
      rs.sort(function(a,b){ return a.no.localeCompare(b.no,'zh',{numeric:true}); });
      rs.forEach(function(r){ list.appendChild(qCard(r)); });
    } else {
      rs = rs.slice().sort(function(a,b){ return (a.year-b.year) || a.no.localeCompare(b.no,'zh',{numeric:true}); });
      rs.forEach(function(r){ list.appendChild(qCard(r)); });
    }
    if(window.renderMathInElement){ try{ renderMathInElement(list,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false,strict:false}); }catch(e){} }
  }

  function renderAll(){ renderTop(); renderFilters(); renderFreq(); renderListOnly(); }
  function focusQuestion(){
    var target=new URLSearchParams(location.search).get('question');
    if(!target) return;
    var hit=DATA.find(function(r){return r.id===target;});
    if(!hit) return;
    state.subject=hit.subject; state.mode='paper'; state.year=hit.year;
    renderAll();
    setTimeout(function(){
      var el=document.getElementById('question-'+target);
      if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.outline='3px solid var(--acc)'; setTimeout(function(){el.style.outline='';},2500); }
    },50);
  }
  renderAll();
  focusQuestion();
})();
</script>
</body>
</html>
